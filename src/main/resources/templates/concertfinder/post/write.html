<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{concertfinder/layouts/main_layout}">
  <head>
    <meta charset="UTF-8">
    <title>글 작성</title>
    <link layout:fragment="css" rel="stylesheet" th:href="@{/css/post/post_write_style.css}">
    <link layout:fragment="dataTimeCSS" rel="stylesheet" type="text/css" media="screen" href="https://cdnjs.cloudflare.com/ajax/libs/jquery-datetimepicker/2.5.20/jquery.datetimepicker.min.css">

  </head>
  <section layout:fragment="contents" class="write-page-wrapper">
    <div class="container py-5">
      <div class="write-header mb-5 text-center">
        <h2 class="font-weight-bold">커뮤니티 <span class="text-danger">글쓰기</span></h2>
        <p class="text-muted">공연에 대한 정보나 동행 모집, 티켓 양도 소식을 공유해 주세요.</p>
      </div>

      <div class="row justify-content-center">
        <div class="col-lg-9">
          <div class="write-card shadow-sm rounded bg-white p-4 p-md-5 border">
            <form id="postWriteForm">
              <div class="form-group mb-4">
                <label class="form-label font-weight-bold">카테고리</label>
                <div class="category-radio-group d-flex flex-wrap">
                  <label class="category-item">
                    <input type="radio" name="category" value="F" checked>
                    <span class="category-btn">자유글</span>
                  </label>
                  <label class="category-item">
                    <input type="radio" name="category" value="R">
                    <span class="category-btn">동행 모집</span>
                  </label>
                  <label class="category-item">
                    <input type="radio" name="category" value="T">
                    <span class="category-btn">티켓 양도</span>
                  </label>
                </div>
              </div>

              <div id="idStorageTag" th:data-concert-id="${concertId}" class="form-group mb-4">
                <label for="titleInput" class="form-label font-weight-bold">제목</label>
                <input type="text" id="titleInput" name="title" class="form-control custom-input"
                       placeholder="제목을 입력해 주세요 (최대 50자)">
              </div>

              <div class="form-group mb-5">
                <label for="contentInput" class="form-label font-weight-bold">내용</label>
                <textarea id="contentInput" name="content" class="form-control custom-textarea"
                          rows="12" placeholder="공연과 관련된 소중한 이야기를 들려주세요. 타인을 비방하거나 광고성 글은 삭제될 수 있습니다."></textarea>
              </div>
              <div id="accompanyFormArea" class="card mb-4 d-none">
                <div class="card-header bg-secondary text-white font-weight-bold">
                  <i class="bi bi-people-fill mr-1"></i> 동행 모집 상세 정보
                </div>
                <div class="card-body bg-light">
                  <div class="row">
                    <div class="col-md-4 mb-3">
                      <label for="accompanySize" class="form-label small font-weight-bold">모집 인원</label>
                      <div class="input-group">
                        <input type="number" id="accompanySize" name="accompanySize" class="form-control" placeholder="0">
                        <div class="input-group-append">
                          <span class="input-group-text">명</span>
                        </div>
                      </div>
                    </div>

                    <div class="col-md-8 mb-3">
                      <label for="datetimepicker" class="form-label small font-weight-bold">출발 일시</label>
                      <div class="input-group">
                        <input type="text" id="datetimepicker" name="datetimepicker" class="form-control">
                        <div class="input-group-append">
                          <span class="input-group-text calenderBtn"><i class="bi bi-calendar-event"></i></span>
                        </div>
                      </div>

                    </div>

                    <div class="col-12">
                      <label for="departureLocation" class="form-label small font-weight-bold">출발 위치 (모임 장소)</label>
                      <div class="input-group">
                        <div class="input-group-prepend">
                          <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                        </div>
                        <input type="text" id="departureLocation" name="departureLocation" class="form-control" placeholder="예: 강남역 11번 출구, 공연장 정문 앞 등">
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="write-actions d-flex justify-content-center">
                <button id="backBtn" type="button" class="btn btn-cancel mr-3" onclick="history.back();">취소</button>
                <button id="writeBtn" type="submit" class="btn btn-submit px-5">등록하기</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

  </section>

  <script layout:fragment="dateTimePicker" src="https://cdnjs.cloudflare.com/ajax/libs/jquery-datetimepicker/2.5.20/jquery.datetimepicker.full.min.js"></script>
  <script layout:fragment="script">

      var titleLength;

      var token = $("meta[name='_csrf']").attr("content");

      var header = $("meta[name='_csrf_header']").attr("content");

      $.datetimepicker.setLocale('kr');

      $(".calenderBtn").on("click", function() {
          $("#datetimepicker").click();
      });

      $(function () {
        $("#datetimepicker").datetimepicker({
            step: 10,
            format: 'Y년 m월 d일 H시 i분',
        });
      });

      $('input[name=category]').on("change", function() {
          let category = $('input[name=category]:checked').prop('checked',true).val();

          if(category == 'R') {

              $("#accompanyFormArea").removeClass("d-none");
          } else {

              $("#accompanyFormArea").addClass("d-none");

          }

      });

      $("#titleInput").on("input", function() {
          titleLength = $("#titleInput").val().length;
      });

      $("#postWriteForm").on("submit", function(e) {
          e.preventDefault();

          let concertId = $("#idStorageTag").data("concert-id");

          let category = $('input[name=category]:checked').prop('checked',true).val();

          let title = $("#titleInput").val();

          let content = $("#contentInput").val();

          let headCount = $("#accompanySize").val();

          let sDate = $("#datetimepicker").val();

          let sPlace = $("#departureLocation").val();


          if(title == '') {
              alert("제목을 입력 해주세요!");
              $("#titleInput").focus();
              return;
          }

          if(titleLength >= 50) {
              alert("제목은 50글자를 넘을 수 없습니다!");
              $("#titleInput").focus();
              return;
          }

          if(content == '') {
              alert("내용을 입력 해주세요!");
              $("#contentInput").focus();
              return;
          }

          if(category == 'R') {
              if(headCount <= 1) {
                  alert("동행 인원은 최소 두명부터 가능합니다!");
                  return;
              }

              if(sDate == '') {
                  alert("동행 날짜는 필수로 선택 해야 합니다!");
                  return;
              }

              if(sPlace == '') {
                  alert("동행 장소는 필수로 선택 해야 합니다!");
                  return;
              }
          }

          $.ajax({
              type : "post"
              , url: "/post/" + concertId
              , beforeSend: function(xhr) {
                  xhr.setRequestHeader(header, token);
              }
              , data : {"category" : category
                        , "title" : title
                        , "content" : content
                        , "headCount" : headCount
                        , "place" : sPlace
                        , "sDateTime" : sDate
              }
              , success : function() {

                  location.href = "/concert/" + concertId;

              }
              , error : function(xhr) {
                  alert(xhr.responseJSON.message);
              }
          });
      });
  </script>
</html>
