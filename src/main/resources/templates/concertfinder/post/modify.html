<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{concertfinder/layouts/main_layout}">
<head>
    <meta charset="UTF-8">
    <title>글 수정</title>
    <link layout:fragment="css" rel="stylesheet" th:href="@{/css/post/post_write_style.css}">
</head>
    <section layout:fragment="contents" class="write-page-wrapper">
        <div class="container py-5">
            <div class="write-header mb-5 text-center">
                <h2 class="font-weight-bold">커뮤니티 <span class="text-danger">글 수정</span></h2>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-9">
                    <div class="write-card shadow-sm rounded bg-white p-4 p-md-5 border">
                        <form id="postModifyForm" th:data-category="${postModifyInfo.category}">

                            <div id="idStorageTag" th:data-post-id="${postModifyInfo.id}" th:data-post-user-id="${postModifyInfo.userId}" th:data-user-id="${#authentication.principal.loginUserDTO.id}" class="form-group mb-4">
                                <label for="titleInput" class="form-label font-weight-bold">제목</label>
                                <input th:value="${postModifyInfo.title}" type="text" id="titleInput" name="title" class="form-control custom-input"
                                       placeholder="제목을 입력해 주세요 (최대 50자)">
                            </div>

                            <div class="form-group mb-5">
                                <label for="contentInput" class="form-label font-weight-bold">내용</label>
                                <textarea th:text="${postModifyInfo.content}" id="contentInput" name="content" class="form-control custom-textarea"
                                          rows="12" placeholder="공연과 관련된 소중한 이야기를 들려주세요. 타인을 비방하거나 광고성 글은 삭제될 수 있습니다."></textarea>
                            </div>

                            <div class="write-actions d-flex justify-content-center">
                                <button id="backBtn" type="button" class="btn btn-cancel mr-3">취소</button>
                                <button id="writeBtn" type="submit" class="btn btn-submit px-5">등록하기</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script layout:fragment="script">
        var titleLength;

        var userId = $("#idStorageTag").data("user-id");

        var postUserId = $("#idStorageTag").data("post-user-id");

        var token = $("meta[name='_csrf']").attr("content");
        var header = $("meta[name='_csrf_header']").attr("content");

        if(userId != postUserId) {
            alert("비정상적인 접근 입니다!");
            location.href = "/concert/list";
        }

        $("#titleInput").on("input", function() {
            titleLength = $("#titleInput").val().length;
        });

        $("#postModifyForm").on("submit", function(e) {
            e.preventDefault();

            let postId = $("#idStorageTag").data("post-id");

            let category = $("#postModifyForm").data("category");

            let title = $("#titleInput").val();

            let content = $("#contentInput").val();

            if(title == '') {
                alert("제목을 입력 해주세요!");
                $("#titleInput").focus();
                return;
            }

            if(titleLength >= 50) {
                alert("제목은 50글자를 넘을 수 없습니다!");
                $("#titleInput").focus();
                return;
            }

            if(content == '') {
                alert("내용을 입력 해주세요!");
                $("#contentInput").focus();
                return;
            }
            let data = {"category" : category
                        , "title" : title
                        , "content" : content}


            $.ajax({
                type : "put"
                , url: "/post/" + postId
                , contentType : "application/json"
                , beforeSend: function(xhr) {
                    xhr.setRequestHeader(header, token);
                }
                , data : JSON.stringify(data)
                , success : function(response) {

                    location.href = "/post/" + postId;
                }
                , error : function(xhr) {
                    alert(xhr.responseJSON.message);
                }
            });
        });
    </script>
</html>
