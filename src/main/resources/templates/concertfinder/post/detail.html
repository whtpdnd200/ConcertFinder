<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{concertfinder/layouts/main_layout}">
<head>
    <meta charset="UTF-8">
    <title>글 상세</title>
    <link layout:fragment="css" rel="stylesheet" th:href="@{/css/post/post_detail_style.css}">
</head>
    <section layout:fragment="contents" class="post-view-wrapper">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="post-header mb-4">
                        <div th:switch="${postInfo.category}" class="d-flex align-items-center mb-3">
                            <span th:case="F" class="badge badge-category mr-2">자유글</span>
                            <span th:case="R" class="badge badge-category mr-2">동행 모집</span>
                            <span th:case="T" class="badge badge-category mr-2">티켓 양도</span>
                            <span class="text-muted small"><i class="bi bi-clock mr-1"></i> <span th:text="${#temporals.format(postInfo.createdAt, 'yyyy-MM-dd hh:mm:ss')}">2026-01-05 20:45</span></span>
                        </div>
                        <h2 th:text="${postInfo.title}" class="post-title font-weight-bold mb-4">이번 임영웅 콘서트 티켓팅 꿀팁 공유합니다!</h2>

                        <div class="post-meta d-flex justify-content-between align-items-center pb-3 border-bottom">
                            <div class="author-info d-flex align-items-center">
                                <div class="author-avatar mr-2">
                                    <i class="bi bi-person-circle"></i>
                                </div>
                                <span th:text="${postInfo.userNickname}" class="author-name font-weight-bold">재미니팬</span>
                            </div>
                            <div class="post-stats text-muted small">
                                <span><i class="bi bi-chat-dots mr-1"></i> 댓글 12</span>
                            </div>
                        </div>
                    </div>

                    <div class="post-content py-5 mb-5 border-bottom">
                        <p th:text="${postInfo.content}">안녕하세요! 이번 콘서트 티켓팅 다들 성공하셨나요? <br><br>
                            저는 이번에 운 좋게 앞자리 성공해서 제가 사용했던 방법들 공유해보려고 합니다.
                            먼저 브라우저 설정부터 서버 시간 확인하는 법까지 차근차근 정리해드릴게요...</p>
                    </div>

                    <div class="post-actions d-flex justify-content-between">
                        <div>
                            <button class="btn btn-list mr-2">
                                <i class="bi bi-list-ul mr-1"></i> <a class="text-light" th:href="@{/concert/{concertId}(concertId = ${postInfo.concertId})}">목록으로</a>
                            </button>
                        </div>
                        <div th:if="${session.userInfo.id == postInfo.userId}" class="owner-buttons">
                            <button class="btn btn-edit mr-2">
                                <a class="text-dark" th:href="@{/post/modify/{postId}(postId = ${postInfo.id})}">수정하기</a>
                            </button>
                            <button id="deleteModalBtn" th:data-post-id="${postInfo.id}" class="btn btn-delete" data-toggle="modal" data-target="#deleteConfirmModal">
                                삭제하기
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div th:data-concert-id="${postInfo.concertId}" class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header bg-dark text-white">
                        <h5 class="modal-title font-weight-bold">게시글 삭제</h5>
                        <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body p-4 text-center">
                        <p class="mb-0">정말로 이 게시글을 삭제하시겠습니까?<br>삭제된 글은 복구할 수 없습니다.</p>
                    </div>
                    <div class="modal-footer border-0 p-3 justify-content-center">
                        <button type="button" class="btn btn-light px-4 mr-2" data-dismiss="modal">취소</button>
                        <button id="deleteBtn" type="button" class="btn btn-danger px-4">삭제확인</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="comment-area-wrapper mt-5 pt-5 border-top">
            <div class="row justify-content-center">
                <div class="col-lg-10"> <div class="d-flex align-items-center mb-4">
                    <h5 class="font-weight-bold mb-0 border-left-primary pl-3">
                        댓글 <span class="comment-count-text text-danger ml-1">0</span>
                    </h5>
                </div>

                    <div class="comment-write-card shadow-sm rounded bg-white p-4 mb-5 border-0">
                        <form>
                            <div class="form-group mb-3">
                        <textarea id="commentInput" class="form-control comment-textarea bg-light"
                                  rows="3"
                                  placeholder="공연에 대한 궁금한 점이나 소중한 의견을 남겨주세요."></textarea>
                                <div class="text-secondary text-right small"><span id="commentLength">0</span>/250</div>
                            </div>
                            <div class="d-flex justify-content-end">
                                <button id="commentSubmitBtn" type="submit" class="btn btn-dark px-4 font-weight-bold" style="border-radius: 20px;">
                                    등록하기
                                </button>
                            </div>
                        </form>
                    </div>

                    <div class="comment-list-container mt-4">

                        <div class="comment-list mb-4">
<!--                            <template x-for="comment in comments" :key="comment.id">-->
                                <div class="comment-item border-bottom py-3">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <div class="d-flex align-items-center">
                                            <span class="font-weight-bold text-dark small" x-text="comment.userNickname">작성자</span>
                                            <span class="mx-2 text-muted" style="font-size: 0.8rem;">|</span>
                                            <span class="text-muted small" x-text="formatDate(comment.createdAt)">2026-01-07</span>
                                        </div>
                                        <button x-show="comment.isMine" @click="deleteComment(comment.id)" class="btn btn-sm text-muted">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                    <div class="comment-text text-secondary px-1" x-text="comment.content" style="font-size: 0.92rem; line-height: 1.5;">
                                        댓글 내용이 노출됩니다.
                                    </div>
                                </div>
<!--                            </template>-->

<!--                            <template x-if="comments.length === 0">-->
                                <div class="text-center py-5 text-muted border-bottom">
                                    등록된 댓글이 없습니다.
                                </div>
<!--                            </template>-->
                        </div>

<!--                        <nav aria-label="Comment page navigation" x-show="commentPage.totalPages > 1">-->
<!--                            <ul class="pagination pagination-sm justify-content-center comment-pagination">-->
<!--                                <li class="page-item" :class="{ 'disabled': commentPage.number === 0 }">-->
<!--                                    <a class="page-link" href="javascript:void(0)" @click="loadComments(commentPage.number - 1)">-->
<!--                                        <i class="bi bi-chevron-left"></i>-->
<!--                                    </a>-->
<!--                                </li>-->

<!--                                <template x-for="p in commentPageRange" :key="p">-->
<!--                                    <li class="page-item" :class="{ 'active': p === (commentPage.number + 1) }">-->
<!--                                        <a class="page-link" href="javascript:void(0)"-->
<!--                                           x-text="p"-->
<!--                                           @click="loadComments(p - 1)"></a>-->
<!--                                    </li>-->
<!--                                </template>-->

<!--                                <li class="page-item" :class="{ 'disabled': commentPage.number === commentPage.totalPages - 1 }">-->
<!--                                    <a class="page-link" href="javascript:void(0)" @click="loadComments(commentPage.number + 1)">-->
<!--                                        <i class="bi bi-chevron-right"></i>-->
<!--                                    </a>-->
<!--                                </li>-->
<!--                            </ul>-->
<!--                        </nav>-->
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script layout:fragment="script">

        $("#commentInput").on("input", function() {
            let length = $("#commentInput").val().length;

            $("#commentLength").text(length);

            if(length >= 250) {
                alert("댓글은 250글자 제한입니다!");
                $("#commentInput").val($("#commentInput").val().substring(0, 249));
            }
        });

        $("#commentSubmitBtn").on("click", function(e) {
            e.preventDefault();

            let postId = $("#deleteModalBtn").data("post-id");
            let comment = $("#commentInput").val();

            if(comment == '') {
                alert("댓글을 입력 해주세요!");
                $("#commentInput").focus();
                return;
            }

            if($("#commentInput").val().length >= 250) {
                alert("댓글은 250글자를 넘길 수 없습니다!");
                $("#commentInput").focus();
                return;
            }

            $.ajax({
                type: "post"
                , url: "/comment/" + postId
                , data: {"comment" : comment}
                , success: function(response) {
                    if(response.result == 'success') {
                        location.reload();
                    } else {
                        alert(response.message);
                    }

                }
                , error: function (response) {
                    console.log(response);
                    alert("댓글 작성 에러!");
                }
            });
        });

        $("#deleteBtn").on("click", function() {
            let postId = $("#deleteModalBtn").data("post-id");
            let concertId = $("#deleteConfirmModal").data("concert-id");
            $.ajax({
                type : "delete"
                , url : "/post/" + postId
                , success : function(response) {
                    if(response.result == 'success') {
                        location.href = "/concert/" + concertId;
                    } else {
                        alert(response.message);
                    }
                }
                , error : function () {
                    alert("게시글 삭제 에러!");
                }
            });
        });
    </script>
</html>
