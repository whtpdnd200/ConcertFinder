<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{concertfinder/layouts/main_layout}">
<head>
    <title>마이페이지</title>
    <link layout:fragment="css" rel="stylesheet" th:href="@{/css/user/mypage_style.css}">
    <script layout:fragment="alpine" defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
    <section layout:fragment="contents">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-lg-10">

                    <div class="profile-card shadow-sm bg-white p-4 mb-4 border-0">
                        <div class="d-flex align-items-center justify-content-between">
                            <div class="d-flex align-items-center">
                                <div class="profile-avatar mr-4">
                                    <i class="bi bi-person-circle text-primary profile-avatar-icon"></i>
                                </div>
                                <div class="profile-info">
                                    <h3 th:text="${#authentication.principal.loginUserDTO.nickname}" class="font-weight-bold mb-1">
                                        재미니
                                        <i class="bi bi-patch-check-fill text-info nickname-badge" title="인증된 유저"></i>
                                    </h3>
                                    <p th:text="${#authentication.principal.loginUserDTO.email}" class="text-muted mb-0">jamini@example.com</p>
                                    <p class="small text-muted mb-0">
                                        <i class="bi bi-geo-alt-fill"></i> 관심 지역:
                                        <span th:text="${#authentication.principal.loginUserDTO.attentionAreaName}" class="text-dark font-weight-bold">서울특별시</span>
                                    </p>
                                </div>
                            </div>
                            <div class="profile-actions">
                                <a href="/user/modify" class="btn btn-outline-primary btn-sm rounded-pill px-3 mr-2">
                                    <i class="bi bi-gear-fill"></i> 정보 수정
                                </a>
                                <button type="button" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                                    <i class="bi bi-person-x-fill"></i> 회원 탈퇴
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <div class="activity-box shadow-sm bg-white p-4 h-100 border-0">
                                <h5 class="font-weight-bold mb-4 border-bottom pb-3">
                                    <i class="bi bi-heart-fill text-danger mr-2"></i>즐겨찾는 공연
                                </h5>
                                <div th:if="${concertList != null && !concertList.isEmpty()}" th:each="concert : ${concertList}" class="list-group list-group-flush">
                                    <a th:href="@{/concert/{id}(id = ${concert.concertId})}" class="list-group-item list-group-item-action border-0 px-0 d-flex align-items-center">
                                        <div class="concert-thumb mr-3">
                                            <img width="45.38px" height="65px" th:src="${concert.posterPath}">
                                        </div>
                                        <div class="flex-grow-1">
                                            <h6 th:text="${concert.concertName}" class="mb-0 font-weight-bold text-truncate-custom">2025 임영웅 콘서트 [IM HERO]</h6>
                                            <small th:text="${concert.areaName}" class="mb-0 text-muted">서울 특별시</small>
                                        </div>
                                        <i class="bi bi-chevron-right text-muted small"></i>
                                    </a>
                                </div>
                                <div th:if="${concertList == null || concertList.isEmpty()}" class="no-fav-container">
                                    <div class="no-fav-content">
                                        <h3>아직 즐겨찾기한 공연이 없어요!</h3>
                                        <p>마음에 드는 콘서트를 담아보세요!</p>

                                        <a href="/concert/list" class="btn-explore">공연 찾아보기</a>
                                    </div>
                                </div>
                                <div th:if="${concertList != null && !concertList.isEmpty()}" class="activity-footer">
                                    <a href="javascript:void(0)" id="openFavBtn" class="btn btn-link text-primary btn-sm">전체 보기 <i class="bi bi-plus-circle"></i></a>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-6 mb-4">
                            <div class="activity-box shadow-sm bg-white p-4 h-100 border-0">
                                <h5 class="font-weight-bold mb-4 border-bottom pb-3">
                                    <i class="bi bi-chat-dots-fill text-primary mr-2"></i>참여 중인 동행 채팅
                                </h5>
                                <div class="list-group list-group-flush">
                                    <div class="list-group-item border-0 px-0 mb-2">
                                        <div class="d-flex justify-content-between align-items-center mb-1">
                                            <span class="badge badge-pill badge-primary">모집 중</span>
                                            <small class="text-muted">3시간 전</small>
                                        </div>
                                        <h6 class="font-weight-bold mb-1">아이유 콘서트 막콘 같이 가실 분!</h6>
                                        <div class="d-flex justify-content-between align-items-center">
                                            <small class="text-muted"><i class="bi bi-people"></i> 인원: 2 / 4</small>
                                            <a href="#" class="btn btn-sm btn-enter-chat">입장하기</a>
                                        </div>
                                    </div>
                                </div>
                                <div class="activity-footer">
                                    <a href="#" class="btn btn-link text-primary btn-sm">채팅 목록 이동 <i class="bi bi-arrow-right-circle"></i></a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="favoritesModal" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="fw-bold">내 즐겨찾기 목록</h2>
                    <button type="button" class="close-modal">&times;</button>
                </div>
                <div x-data="favoritesComponent()" @load-favorites.window="fetchFavorites()" class="modal-body">

                    <ul id="favoritesList" class="fav-list">
                        <template x-for="item in favorites.data" :key="item.concertId">
                            <li class="fav-item d-flex align-items-center mb-3">
                                <a :href="'/concert/' + item.concertId" class="d-flex align-items-center w-100 text-decoration-none">
                                    <div class="mr-3">
                                        <img width="45px" height="60px" :src="item.posterPath" class="rounded">
                                    </div>
                                    <div class="flex-grow-1">
                                        <h6 x-text="item.concertName" class="mb-0 font-weight-bold text-dark">공연제목</h6>
                                        <small x-text="item.areaName" class="text-muted">지역명</small>
                                    </div>
                                </a>
                            </li>
                        </template>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <script layout:fragment="script">

        var userId = $("#dataValue").data("id");

        function favoritesComponent() {
            return {
                favorites: [],
                fetchFavorites() {
                    fetch("/concert/" + userId + "/list")
                        .then(res => {
                            if(!res.ok) {
                                return res.json().then(err => {
                                    throw new Error(err.message);
                                });
                            }
                            return res.json();
                        })
                        .then(data => this.favorites = data)
                        .catch(error => alert(error.message));
                }
            }
        }

        $(document).ready(function() {

            // 1. 모달 열기 (전체보기 버튼 클릭 시)
            $('#openFavBtn').on('click', function(e) {
                e.preventDefault();
                $('#favoritesModal').css('display', 'flex').hide().fadeIn(200);

                $('body').css('overflow', 'hidden');
                window.dispatchEvent(new CustomEvent('load-favorites'));
            });

            // 2. 모달 닫기 (X 버튼 혹은 배경 클릭 시)
            $('.close-modal, .modal-overlay').on('click', function(e) {
                // 배경 클릭 시 자식 요소인 modal-content 클릭은 무시
                if (e.target !== this && !$(e.target).hasClass('close-modal')) return;

                $('#favoritesModal').fadeOut(200);
                $('body').css('overflow', 'auto');
            });
        });
    </script>
</html>
