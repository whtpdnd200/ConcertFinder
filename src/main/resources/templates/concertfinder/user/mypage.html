<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/css/user/user_style.css">
</head>
<body>
    <div id="user-wrap">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-lg-10">

                    <div class="profile-card shadow-sm bg-white p-4 mb-4">
                        <div class="d-flex align-items-center justify-content-between">
                            <div class="d-flex align-items-center">
                                <div class="profile-avatar mr-4">
                                    <i class="fas fa-user-circle fa-5x text-secondary"></i>
                                </div>
                                <div class="profile-info">
                                    <h3 class="font-weight-bold mb-1">재미니 <span class="badge badge-primary ml-2">General</span></h3>
                                    <p class="text-muted mb-0">jamini@example.com</p>
                                    <p class="small text-muted mb-0">관심 지역: <span class="text-dark">서울특별시</span></p>
                                </div>
                            </div>
                            <div class="profile-actions">
                                <a href="/user/modify" class="btn btn-outline-primary btn-sm mr-2">
                                    <i class="fas fa-edit"></i> 정보 수정
                                </a>
                                <button type="button" class="btn btn-outline-danger btn-sm" id="btnDeleteAccount">
                                    <i class="fas fa-user-slash"></i> 회원 탈퇴
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <div class="activity-box shadow-sm bg-white p-4 h-100">
                                <h5 class="font-weight-bold mb-4 border-bottom pb-2">
                                    <i class="fas fa-heart text-danger mr-2"></i>즐겨찾는 콘서트
                                </h5>
                                <ul class="list-unstyled">
                                    <li class="mb-3 d-flex align-items-center">
                                        <div class="concert-thumb mr-3"></div>
                                        <div>
                                            <p class="mb-0 font-weight-bold">2025 싸이 흠뻑쇼</p>
                                            <small class="text-muted">잠실종합운동장</small>
                                        </div>
                                    </li>
                                </ul>
                                <a href="/concert/list" class="small text-primary">더 보기 ></a>
                            </div>
                        </div>

                        <div class="col-md-6 mb-4">
                            <div class="activity-box shadow-sm bg-white p-4 h-100">
                                <h5 class="font-weight-bold mb-4 border-bottom pb-2">
                                    <i class="fas fa-users text-primary mr-2"></i>참여 중인 동행
                                </h5>
                                <ul class="list-unstyled">
                                    <li class="mb-3">
                                        <p class="mb-0 font-weight-bold">아이유 콘서트 같이 가실 분!</p>
                                        <small class="text-muted">상태: 모집 중 | 현재 인원: 2/4</small>
                                    </li>
                                </ul>
                                <a href="/chat/list" class="small text-primary">채팅방 목록으로 이동 ></a>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
</body>
</html>
