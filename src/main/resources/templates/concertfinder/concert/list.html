<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{concertfinder/layouts/main_layout}">
<head>
    <title>콘서트 목록 탐색</title>
    <link layout:fragment="css" rel="stylesheet" th:href="@{/css/concert/concert_list_style.css}">
</head>
    <section layout:fragment="contents">
        <div class="container py-5">

            <div class="mb-5 text-center">
                <h2 class="font-weight-bold">놓치지 말아야 할 <span class="text-primary">콘서트</span></h2>
                <p class="text-muted">전국의 모든 대중음악 공연 정보를 한눈에 확인하세요.</p>
            </div>

            <section class="search-section p-4 mb-5 shadow-sm">
                <form id="searchForm" class="row no-gutters justify-content-center">
                    <div class="col-md-3 px-1">
                        <select class="form-control filter-select">
                            <option value="">모든 지역</option>
                            <option value="11">서울</option>
                            <option value="31">경기</option>
                            <option value="26">부산</option>
                        </select>
                    </div>
                    <div class="col-md-7 px-1">
                        <div class="input-group">
                            <input type="text" class="form-control search-input" placeholder="아티스트명 또는 콘서트 제목으로 검색">
                            <div class="input-group-append">
                                <button class="btn btn-search" type="button">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </section>

            <div class="row">
                <div class="col-lg-3 col-md-6 mb-4">
                    <div class="card concert-card shadow-sm h-100">
                        <div class="card-img-wrapper">
                            <span class="status-badge badge-performing shadow-sm">공연중</span>
                            <button class="like-btn shadow-sm"><i class="bi bi-heart"></i></button>
                            <img src="https://via.placeholder.com/350x500" alt="콘서트 포스터">
                        </div>
                        <div class="card-body p-3">
                            <h6 class="card-title font-weight-bold mb-2 text-truncate">2025 임영웅 콘서트 [IM HERO]</h6>
                            <div class="small text-muted">
                                <p class="mb-1"><i class="bi bi-geo-alt-fill mr-1"></i>서울월드컵경기장</p>
                                <p class="mb-0"><i class="bi bi-calendar-event mr-1"></i>2025.05.24 ~ 05.25</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-3 col-md-6 mb-4">
                    <div class="card concert-card shadow-sm h-100">
                        <div class="card-img-wrapper">
                            <span class="status-badge badge-upcoming shadow-sm">공연예정</span>
                            <button class="like-btn shadow-sm"><i class="bi bi-heart-fill"></i></button>
                            <img src="https://via.placeholder.com/350x500" alt="콘서트 포스터">
                        </div>
                        <div class="card-body p-3">
                            <h6 class="card-title font-weight-bold mb-2 text-truncate">싸이 흠뻑쇼 SUMMERSWAG 2025</h6>
                            <div class="small text-muted">
                                <p class="mb-1"><i class="bi bi-geo-alt-fill mr-1"></i>잠실종합운동장</p>
                                <p class="mb-0"><i class="bi bi-calendar-event mr-1"></i>2025.07.12 ~ 08.31</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <nav class="mt-5">
                <div class="pagination-wrapper">
                    <button class="btn-page" id="prevPage" title="이전 페이지">
                        <i class="bi bi-arrow-left"></i>
                    </button>

                    <span class="page-indicator">PAGE <span id="currentPage">1</span></span>

                    <button class="btn-page" id="nextPage" title="다음 페이지">
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </div>
            </nav>

        </div>
    </section>
    <script layout:fragment="script">

    </script>
</html>
