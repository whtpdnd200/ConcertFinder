<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{concertfinder/layouts/main_layout}">
<head>
    <title>콘서트 목록 탐색</title>
    <link layout:fragment="css" rel="stylesheet" th:href="@{/css/concert/concert_list_style.css}">
</head>
    <section th:data-next="${concertList.hasNext}" id="contentsHeader" layout:fragment="contents">
        <div class="container py-5">
            <div class="mb-5 text-center">
                <h2 class="font-weight-bold">놓치지 말아야 할 <span class="text-primary">콘서트</span></h2>
                <p class="text-muted">전국의 모든 대중음악 공연 정보를 한눈에 확인하세요.</p>
            </div>
            <section class="search-section p-4 mb-5 shadow-sm">
                <form id="searchForm" class="row no-gutters justify-content-center">
                    <div class="col-md-3 px-1">
                        <select id="areaSelect" class="form-control filter-select">
                            <option th:selected="${areaCode == null || areaCode == '00'}" value="00">모든 지역</option>
                            <option th:selected="${areaCode == sido.sidoCode}" th:each="sido : ${sidoList}" th:value="${sido.sidoCode}" th:text="${sido.sidoName}"></option>
                        </select>
                    </div>
                    <div class="col-md-7 px-1">
                        <div class="input-group">
                            <input th:value="${keyword}" id="keywordInput" type="text" class="form-control search-input" placeholder="아티스트명 또는 콘서트 제목으로 검색">
                            <div class="input-group-append">
                                <button id="searchBtn" class="btn btn-search" type="submit">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </section>
            <div class="preference-info-section">
                <div class="container">
                    <h2 class="preference-title">
                        <div th:if="${areaCode == '' || areaCode == null}" >
                            <i class="fas fa-map-marker-alt"></i> 선호 지역 <span th:text="${#authentication.principal.loginUserDTO.attentionAreaName}" class="highlight-area">서울</span>의 콘서트 목록
                        </div>
                        <div th:if="${areaCode != '' && areaCode != null}">
                            <i class="fas fa-map-marker-alt"></i> 검색 지역 <span th:text="${areaName}" class="highlight-area">서울</span>의 콘서트 목록
                        </div>
                    </h2>
                    <p class="preference-subtitle">현재 해당 지역에서 진행 중이거나 예정된 공연입니다.</p>
                </div>
            </div>
            <div th:if="${concertList.lists != null}" class="row">
                <div th:each="info : ${concertList.lists}" class="info col-lg-3 col-md-6 mb-4">
                    <a th:href="@{/concert/{id}(id = ${info.concertId})}">
                        <div class="card concert-card shadow-sm h-100">
                            <div th:switch="${info.state}" class="card-img-wrapper">
                                <span th:case="공연중" class="status-badge badge-performing shadow-sm">공연중</span>
                                <span th:case="공연예정" class="status-badge badge-upcoming shadow-sm">공연예정</span>
                                <span th:case="*" th:text="${info.state}" class="status-badge badge-upcoming shadow-sm">공연예정</span>
                                <button th:if="${!info.favorites}" th:data-concert-id="${info.concertId}" class="like-btn shadow-sm concertFavorites"><i class="bi bi-heart"></i></button>
                                <button th:unless="${!info.favorites}" th:data-concert-id="${info.concertId}" class="like-btn shadow-sm concertUnFavorites"><i class="bi bi-heart-fill"></i></button>

                                <img th:src="${info.posterPath}" alt="콘서트 포스터">
                            </div>
                            <div class="card-body p-3">
                                <h6 th:data-favorites="${info.favorites}" th:text="${info.concertName}" class="card-title font-weight-bold mb-2 text-truncate">2025 임영웅 콘서트 [IM HERO]</h6>
                                <div class="small text-muted">
                                    <p class="mb-1"><i class="bi bi-geo-alt-fill mr-1"></i><span th:text="${info.area}">서울월드컵경기장</span></p>
                                    <div class="d-flex">
                                        <p class="mb-0"><i class="bi bi-calendar-event mr-1"></i><span th:text="${info.sDate}" >2025.05.24</span></p>
                                        <span>&nbsp;~&nbsp;</span>
                                        <p class="mb-0"><span th:text="${#strings.substring(info.eDate, 5)}">2025.05.24</span></p>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
            <div th:unless="${concertList.lists != null}" class="empty-concert-section">
                <div class="empty-icon">
                    <i class="fas fa-calendar-times"></i> </div>
                <h3 th:if="${areaCode == '' || areaCode == null}" class="empty-message">
                    현재 <span class="target-area" th:text="${#authentication.principal.loginUserDTO.attentionAreaName}">서울</span> 지역에 등록된 공연이 없습니다.
                </h3>
                <h3 th:if="${areaCode != '' && areaCode != null}" class="empty-message">
                    현재 <span class="target-area" th:text="${areaName}">서울</span> 지역에 등록된 공연이 없습니다.
                </h3>
                <p class="empty-hint">다른 지역을 검색하거나, 나중에 다시 확인해 주세요!</p>
            </div>

            <nav class="mt-5">
                <div class="pagination-wrapper">
                    <button class="btn-page" id="prevPage" title="이전 페이지">
                        <i class="bi bi-arrow-left"></i>
                    </button>

                    <span class="page-indicator">PAGE <span id="currentPage">1</span></span>

                    <button class="btn-page" id="nextPage" title="다음 페이지">
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </div>
            </nav>

        </div>
    </section>
    <script layout:fragment="script">

        var token = $("meta[name='_csrf']").attr("content");

        var header = $("meta[name='_csrf_header']").attr("content");

        window.onload = function() {



            var url = new URL(location.href).searchParams;


            if(!url.has("page")) {
                url.append("page", "1");
            }

            var page = url.get("page");

            var areaCode = url.get("code");

            if(areaCode == null) {
                areaCode = '';
            }

            var keyword = url.get("keyword");

            if(keyword == null) {
                keyword = '';
            }

            $(".concertUnFavorites").on("click", function(e) {
                e.preventDefault();

                let concertId = $(this).data("concert-id");

                $.ajax({
                    type: "delete"
                    , url: "/favorites/" + concertId
                    , beforeSend: function(xhr) {
                        xhr.setRequestHeader(header, token);
                    }
                    , success: function() {

                        location.href = "/concert/list?code=" + areaCode + "&keyword=" + keyword + "&page=" + page;
                    }
                    , error: function(xhr) {
                        alert(xhr.responseJSON.message);
                    }
                });
            });

            $(".concertFavorites").on("click", function(e) {
                e.preventDefault();

                let concertId = $(this).data("concert-id");

                $.ajax({
                    type: "post"
                    , url: "/favorites/" + concertId
                    , beforeSend: function(xhr) {
                        xhr.setRequestHeader(header, token);
                    }
                    , success: function() {

                        location.href = "/concert/list?code=" + areaCode + "&keyword=" + keyword + "&page=" + page;
                    }
                    , error: function(xhr) {
                        alert(xhr.responseJSON.message);
                    }
                });
            });


            $("#currentPage").text(page);

            $("#prevPage").on("click", function() {
                if(page <= 1) {
                    alert("첫 페이지 입니다!");
                    return;
                }
                page--;
                location.href = "/concert/list?code=" + areaCode + "&keyword=" + keyword + "&page=" + page;
            });

            $("#nextPage").on("click", function() {
                let hasNext = $("#contentsHeader").data("next");

                if(!hasNext) {
                    alert("다음 페이지가 없습니다!");
                    return;
                }
                page++;
                location.href = "/concert/list?code=" + areaCode + "&keyword=" + keyword + "&page=" + page;
            });

            $("#searchForm").on("submit", function(e) {
                e.preventDefault();
                let areaCode = $("#areaSelect").val();
                let keyword = $("#keywordInput").val();


                location.href = "/concert/list?code=" + areaCode + "&keyword=" + keyword;
            });
        }
    </script>
</html>
