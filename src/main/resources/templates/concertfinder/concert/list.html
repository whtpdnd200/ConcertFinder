<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{concertfinder/layouts/main_layout}">
<head>
    <title>콘서트 목록 탐색</title>
    <link layout:fragment="css" rel="stylesheet" th:href="@{/css/concert/concert_list_style.css}">
</head>
    <section th:data-next="${concertList.hasNext}" id="contentsHeader" layout:fragment="contents">
        <div class="container py-5">
            <div class="mb-5 text-center">
                <h2 class="font-weight-bold">놓치지 말아야 할 <span class="text-primary">콘서트</span></h2>
                <p class="text-muted">전국의 모든 대중음악 공연 정보를 한눈에 확인하세요.</p>
            </div>
            <section class="search-section p-4 mb-5 shadow-sm">
                <form id="searchForm" class="row no-gutters justify-content-center">
                    <div class="col-md-3 px-1">
                        <select class="form-control filter-select">
                            <option value="">모든 지역</option>
                            <option th:each="sido : ${sidoList}" th:value="${sido.sidoCode}" th:utext="${sido.sidoName}"></option>
                        </select>
                    </div>
                    <div class="col-md-7 px-1">
                        <div class="input-group">
                            <input type="text" class="form-control search-input" placeholder="아티스트명 또는 콘서트 제목으로 검색">
                            <div class="input-group-append">
                                <button class="btn btn-search" type="button">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </section>
            <div class="preference-info-section">
                <div class="container">
                    <h2 class="preference-title">
                        <i class="fas fa-map-marker-alt"></i> 선호 지역 <span th:text="${session.userInfo.getAttentionAreaName()}" class="highlight-area">서울</span>의 콘서트 목록
                    </h2>
                    <p class="preference-subtitle">현재 해당 지역에서 진행 중이거나 예정된 공연입니다.</p>
                </div>
            </div>
            <div th:if="${concertList.lists != null}" class="row">
                <div th:each="info : ${concertList.lists}" class="info col-lg-3 col-md-6 mb-4">
                    <div class="card concert-card shadow-sm h-100">
                        <div th:switch="${info.state}" class="card-img-wrapper">
                            <span th:case="공연중" class="status-badge badge-performing shadow-sm">공연중</span>
                            <span th:case="공연예정" class="status-badge badge-upcoming shadow-sm">공연예정</span>
                            <button class="like-btn shadow-sm"><i class="bi bi-heart"></i></button>
                            <img th:src="${info.posterPath}" alt="콘서트 포스터">
                        </div>
                        <div class="card-body p-3">
                            <h6 th:text="${info.concertName}" class="card-title font-weight-bold mb-2 text-truncate">2025 임영웅 콘서트 [IM HERO]</h6>
                            <div class="small text-muted">
                                <p class="mb-1"><i class="bi bi-geo-alt-fill mr-1"></i><span th:text="${info.area}">서울월드컵경기장</span></p>
                                <div class="d-flex">
                                    <p class="mb-0"><i class="bi bi-calendar-event mr-1"></i><span th:text="${info.sDate}" >2025.05.24</span></p>
                                    <span>&nbsp;~&nbsp;</span>
                                    <p class="mb-0"><span th:text="${#strings.substring(info.eDate, 5)}">2025.05.24</span></p>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:unless="${concertList.lists != null}" class="empty-concert-section">
                <div class="empty-icon">
                    <i class="fas fa-calendar-times"></i> </div>
                <h3 class="empty-message">
                    현재 <span class="target-area" th:text="${session.userInfo.getAttentionAreaName()}">서울</span> 지역에 등록된 공연이 없습니다.
                </h3>
                <p class="empty-hint">다른 지역을 검색하거나, 나중에 다시 확인해 주세요!</p>
            </div>

            <nav class="mt-5">
                <div class="pagination-wrapper">
                    <button class="btn-page" id="prevPage" title="이전 페이지">
                        <i class="bi bi-arrow-left"></i>
                    </button>

                    <span class="page-indicator">PAGE <span id="currentPage">1</span></span>

                    <button class="btn-page" id="nextPage" title="다음 페이지">
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </div>
            </nav>

        </div>
    </section>
    <script layout:fragment="script">

        window.onload = function() {

            var url = new URL(location.href).searchParams;


            if(!url.has("page")) {
                url.append("page", "1");

            }

            var page = url.get("page");

            $("#currentPage").text(page);

            $("#prevPage").on("click", function() {
                if(page <= 1) {
                    alert("첫 페이지 입니다!");
                    return;
                }
                page--;
                location.href = "/concert/list?page=" + page;
            });

            $("#nextPage").on("click", function() {
                let hasNext = $("#contentsHeader").data("next");
                if(!hasNext) {
                    alert("다음 페이지가 없습니다!");
                    return;
                }
                page++;
                location.href = "/concert/list?page=" + page;
            });
        }
    </script>
</html>
