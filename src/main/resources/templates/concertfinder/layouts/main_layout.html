<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:x-on="http://www.w3.org/1999/xhtml"
      xmlns:x-bind="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title layout:title-pattern="$LAYOUT_TITLE : $CONTENT_TITLE">ConcertFinder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/layouts/user_style.css}">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <th:block layout:fragment="kakao"></th:block>
    <th:block layout:fragment="css"></th:block>
    <th:block layout:fragment="postFunctionScript"></th:block>
    <th:block layout:fragment="reviewFunctionScript"></th:block>
    <th:block layout:fragment="dataTimeCSS"></th:block>
    <th:block layout:fragment="chatJS"></th:block>
</head>
<body>
    <header id="dataValue" th:data-id="${#authentication.principal.loginUserDTO.id}" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand font-weight-bold text-primary" href="/concert/list">
                <i class="fas fa-ticket-alt"></i> ConcertFinder
            </a>

            <div class="ml-auto d-flex align-items-center">

                <div class="dropdown mr-2" x-data="notificationHandler()">
                    <a href="javascript:void(0)" class="nav-link text-dark position-relative p-2" id="notificationBtn" data-toggle="dropdown">
                        <i class="bi bi-bell" style="font-size: 1.3rem;"></i>
                        <span x-show="notifications.length > 0"
                              x-text="notifications.length"
                              class="badge badge-danger position-absolute"
                              style="top: 5px; right: 3px; font-size: 0.65rem; border-radius: 50%; padding: 0.2em 0.45em;">
                        </span>
                    </a>

                    <div class="dropdown-menu dropdown-menu-right shadow border-0 mt-2">
                        <div class="dropdown-header d-flex justify-content-between align-items-center">
                            <span>새로운 알림</span>
                            <template x-if="notifications.length != 0">
                                <button @click="readAll()" class="btn btn-link btn-sm p-0 text-primary" style="font-size: 0.75rem; text-decoration: none;">모두 읽음</button>
                            </template>
                        </div>

                        <div id="notificationList">
                            <template x-if="notifications.length === 0">
                                <div class="py-5 text-center">
                                    <i class="bi bi-bell-slash text-muted" style="font-size: 2rem; display: block; margin-bottom: 10px;"></i>
                                    <span class="small text-muted">새로운 알림이 없습니다.</span>
                                </div>
                            </template>

                            <template x-for="notice in notifications" :key="notice.id">
                                <a :title="notice.content" :href="notice.url" @click="readOne(notice.id)" class="dropdown-item noticeList">
                                    <div class="notice-content" x-text="notice.content"></div>
                                    <div class="notice-time">
                                        <i class="bi bi-clock"></i>
                                        <span x-text="notice.time"></span>
                                    </div>
                                </a>
                            </template>
                        </div>
                    </div>
                </div>

                <a href="/user/mypage" class="nav-link text-dark small font-weight-bold">
                    <i class="far fa-user-circle"></i> 마이페이지
                </a>
                <a id="logoutBtn" href="javascript:void(0)" class="nav-link text-muted small">
                    로그아웃
                </a>
            </div>
        </div>
    </header>
    <div id="wrap">
        <th:block layout:fragment="contents">

        </th:block>
    </div>

    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-1 small">© 2026 ConcertFinder. All rights reserved.</p>
            <p class="text-muted" style="font-size: 0.75rem;">KOPIS Open API 기반 공연 정보 커뮤니티</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <th:block layout:fragment="dateTimePicker"></th:block>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <script>

        function notificationHandler() {
            return {
                notifications: [], // 알림 리스트 배열
                isConnected: false,
                readOne(id) {

                    let token = $("meta[name='_csrf']").attr("content");
                    let header = $("meta[name='_csrf_header']").attr("content");

                    const self = this;
                    $.ajax({
                        type: "patch"
                        , url: "/sse/modify/" + id
                        , beforeSend: function(xhr) {
                            xhr.setRequestHeader(header, token);
                        }
                        , success : function() {

                            // 서버 수정 성공 후, 화면상의 배열 데이터도 읽음 상태로 변경
                            self.notifications = self.notifications.filter(n => n.id !== id);
                            console.log(id + "번 알림 읽음 처리 완료");
                        }
                        , error : function(xhr) {
                            alert(xhr.responseJSON.message);
                        }
                    });
                },
                formatTime(dateString) {

                    const date = new Date(dateString);
                    const now = new Date();
                    const isToday = date.toDateString() === now.toDateString();

                    const timeString = date.toLocaleTimeString('ko-KR', {
                        hour: 'numeric',
                        minute: '2-digit',
                        hour12: true // '오후' 표시를 위해 true 설정
                    });

                    return isToday ? timeString : `${date.getMonth() + 1}월 ${date.getDate()}일`;
                },
                readAll() {

                    let token = $("meta[name='_csrf']").attr("content");
                    let header = $("meta[name='_csrf_header']").attr("content");
                    const self = this;

                    $.ajax({
                        type: "patch",
                        url: "/sse/modify-all",
                        beforeSend: function(xhr) {
                            xhr.setRequestHeader(header, token);
                        },
                        success: function() {
                            // 모든 알림이 읽음 처리되었으므로 화면의 리스트를 비움
                            self.notifications = [];
                            console.log("모든 알림 읽음 처리 완료");
                        },
                        error: function(xhr) {
                            alert(xhr.responseJSON.message);
                        }
                    });
                },
                init() {
                    // 1. 초기 연결 시도
                    const eventSource = new EventSource('/sse/subscribe');

                    eventSource.onopen = () => {
                        this.isConnected = true;
                        console.log("SSE 연결 성공");
                    };

                    // 2. 이벤트 리스너 등록 (여기서 this는 Alpine의 data를 가리킴)
                    eventSource.addEventListener("notice", (event) => {
                        console.log(event);
                        console.log("새 알림 수신:", event.data);
                        const data = JSON.parse(event.data);

                        // console.log(data);

                        // 데이터를 배열 맨 앞에 추가 (화면에 즉시 반영됨)
                        this.notifications.unshift({
                            id: data.id,
                            content: data.message, // Java DTO 필드명에 맞춰 수정
                            url: data.url || '#',
                            time: this.formatTime(data.createdAt || new Date())
                        });
                    });

                    eventSource.onerror = (error) => {
                        this.isConnected = false;
                        console.error("SSE 에러 발생:", error);
                        // 필요하다면 여기서 eventSource.close() 후 재연결 로직 추가 가능
                    };
                }
            }
        }


        $("#logoutBtn").on("click", function() {

            $.ajax({
                type: "get"
                , url: "/user/logout"
                , success : function() {

                    location.href = "/user/login";
                }
                , error : function(xhr) {
                    alert(xhr.responseJSON.message);
                }
            });
        });
    </script>
    <th:block layout:fragment="script"></th:block>
</body>
</html>
