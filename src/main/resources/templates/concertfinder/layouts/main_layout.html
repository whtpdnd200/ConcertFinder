<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:x-on="http://www.w3.org/1999/xhtml"
      xmlns:x-bind="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title layout:title-pattern="$LAYOUT_TITLE : $CONTENT_TITLE">ConcertFinder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/layouts/user_style.css}">
    <th:block layout:fragment="alpine"></th:block>
    <th:block layout:fragment="kakao"></th:block>
    <th:block layout:fragment="css"></th:block>
    <th:block layout:fragment="postFunctionScript"></th:block>
    <th:block layout:fragment="reviewFunctionScript"></th:block>
    <th:block layout:fragment="dataTimeCSS"></th:block>
    <th:block layout:fragment="chatJS"></th:block>
</head>
<body>
    <header id="dataValue" th:data-id="${#authentication.principal.loginUserDTO.id}" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand font-weight-bold text-primary" href="/concert/list">
                <i class="fas fa-ticket-alt"></i> ConcertFinder
            </a>

            <div class="ml-auto d-flex align-items-center">

                <div class="dropdown mr-2">
                    <a href="javascript:void(0)" class="nav-link text-dark position-relative p-2" id="notificationBtn" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        <i class="bi bi-bell" style="font-size: 1.3rem;"></i>

                        <span id="notificationBadge" class="badge badge-danger position-absolute d-none"
                              style="top: 5px; right: 3px; font-size: 0.65rem; border-radius: 50%; padding: 0.2em 0.45em;">0</span>
                    </a>

                    <div class="dropdown-menu dropdown-menu-right shadow border-0 mt-2" id="notificationMenu" style="width: 300px; max-height: 400px; overflow-y: auto;">
                        <h6 class="dropdown-header border-bottom pb-2">새로운 알림</h6>
                        <div id="notificationList">
                            <a class="dropdown-item text-center small text-muted py-3">새로운 알림이 없습니다.</a>
                        </div>
                    </div>
                </div>

                <a href="/user/mypage" class="nav-link text-dark small font-weight-bold">
                    <i class="far fa-user-circle"></i> 마이페이지
                </a>
                <a id="logoutBtn" href="javascript:void(0)" class="nav-link text-muted small">
                    로그아웃
                </a>
            </div>
        </div>
    </header>
    <div id="wrap">
        <th:block layout:fragment="contents">

        </th:block>
    </div>

    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-1 small">© 2026 ConcertFinder. All rights reserved.</p>
            <p class="text-muted" style="font-size: 0.75rem;">KOPIS Open API 기반 공연 정보 커뮤니티</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <th:block layout:fragment="dateTimePicker"></th:block>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <script>



        // sse 연결 시도
        const eventSource = new EventSource('/sse/subscribe');

        eventSource.onopen = (event) => {
            console.log("sse 연결 성공");
        };

        eventSource.onmessage = (event) => {

            console.log(event);
            let data = JSON.parse(event.data);
            console.log(data);
        };

        eventSource.onerror = (error) => {
            console.error("SSE 연결 중 에러 발생:", error);

        };


        $("#logoutBtn").on("click", function() {

            var token = $("meta[name='_csrf']").attr("content");
            var header = $("meta[name='_csrf_header']").attr("content");

            $.ajax({
                type: "post"
                , url: "/user/logout"
                , beforeSend: function(xhr) {
                    xhr.setRequestHeader(header, token);
                }
                , success : function() {

                    location.href = "/user/login";
                }
                , error : function(xhr) {
                    alert(xhr.responseJSON.message);
                }
            });
        });
    </script>
    <th:block layout:fragment="script"></th:block>
</body>
</html>
