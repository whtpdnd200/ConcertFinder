<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$LAYOUT_TITLE : $CONTENT_TITLE">ConcertFinder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/layouts/user_style.css}">

    <th:block layout:fragment="css"></th:block>
</head>
<body>
    <header id="dataValue" th:data-id="${session.userInfo.id}" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand font-weight-bold text-primary" th:href="@{/concert/list}">
                <i class="fas fa-ticket-alt"></i> ConcertFinder
            </a>

            <div class="ml-auto d-flex align-items-center">
                <a th:href="@{/user/mypage}" class="nav-link text-dark small font-weight-bold">
                    <i class="far fa-user-circle"></i> 마이페이지
                </a>
                <a th:href="@{/user/logout}" class="nav-link text-muted small">
                    로그아웃
                </a>
            </div>
        </div>
    </header>
    <div id="wrap">
        <th:block layout:fragment="contents">

        </th:block>
    </div>

    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-1 small">© 2025 ConcertFinder. All rights reserved.</p>
            <p class="text-muted" style="font-size: 0.75rem;">KOPIS Open API 기반 공연 정보 커뮤니티</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <th:block layout:fragment="script"></th:block>
</body>
</html>
