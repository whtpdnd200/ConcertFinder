spring:
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  application:
    name: concertFinder
  config:
    import: [security-variable.yml, properties/properties.yml]
  thymeleaf:
    cache: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/concert_finder?serverTimezone=Asia/Seoul
    username: root
    password: ${mysql.password}